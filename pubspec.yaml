name: isp_tech_app
description: ISP Conecta - Aplicativo para técnicos de campo gerenciarem ordens de serviço com operação offline-first.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8

  # HTTP
  http: ^1.2.2

  # Banco de dados local
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # Armazenamento seguro
  flutter_secure_storage: ^9.2.2

  # Geolocalização
  geolocator: ^13.0.2

  # Câmera / Galeria
  image_picker: ^1.1.2
  image: ^4.2.0

  # Criptografia HMAC-SHA256
  crypto: ^3.0.6

  # Permissões
  permission_handler: ^11.4.0

  # Conectividade
  connectivity_plus: ^6.1.4

  # Path provider
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - assets/images/
